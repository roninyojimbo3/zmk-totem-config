# Silso TOTEM - central/left half
# Based on KeyboardHoarders TOTEM configuration

#CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_KEYBOARD_NAME="KBHTotem"

# Sleep after 15 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Required for the mouse movement and scroll bindings on the NAV layer
CONFIG_ZMK_POINTING=y

# Increased transmit power retained from the stock KeyboardHoarders configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Ten host Bluetooth profiles plus one split-peripheral connection.
# ZMK specifies that these values be set only on the central half of a split.
CONFIG_BT_MAX_CONN=11
CONFIG_BT_MAX_PAIRED=11

# Deliberately not enabled: stock TOTEM does not have the required ZMK Studio physical-layout configuration.
#CONFIG_ZMK_STUDIO=y
