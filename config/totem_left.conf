# Silso TOTEM - left peripheral half
# Keyboard Hoarders resin build / XIAO BLE

CONFIG_ZMK_KEYBOARD_NAME="KBHTotem"

# Sleep after 2 hours
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Required because the shared TOTEM keymap contains mouse/scroll behaviors
CONFIG_ZMK_POINTING=y

# Increased transmit power retained from the stock KeyboardHoarders configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deliberately not enabled: stock TOTEM does not have the required ZMK Studio physical-layout configuration.
#CONFIG_ZMK_STUDIO=y
