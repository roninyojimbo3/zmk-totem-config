# Silso TOTEM - peripheral/right half
# Based on KeyboardHoarders TOTEM configuration

#CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_KEYBOARD_NAME="KBHTotem"

# Sleep after 2 hours
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Retained because the shared TOTEM keymap contains mouse/scroll behaviors
CONFIG_ZMK_POINTING=y

# Increased transmit power retained from the stock KeyboardHoarders configuration
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Bluetooth host profile count is intentionally not set on this peripheral half.

#CONFIG_ZMK_STUDIO=y
